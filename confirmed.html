<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — Raunaq</title>
  <style>
    :root {
      --burgundy: #881337;
      --burgundy-dark: #4C0519;
      --gold: #C6A15B;
      --gold-light: #DFBA73;
      --cream: #FFFBF3;
      --warm-white: #FAF5ED;
      --charcoal: #2D3142;
      --gray-light: #E2E8F0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--warm-white);
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(76, 5, 25, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--gray-light);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(198, 161, 91, 0.15) 0%, rgba(136, 19, 55, 0.08) 100%);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--burgundy);
    }
    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      stroke: var(--burgundy);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .brand {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      color: var(--burgundy);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      color: #64748B;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      padding: 10px 20px;
      background: var(--cream);
      border: 1px solid var(--gold-light);
      border-radius: 9999px;
      color: var(--burgundy-dark);
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Raunaq • Shadi Album</div>
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Email confirmed</h1>
    <p>Your Raunaq host account is ready. Open the app and sign in.</p>
    <div class="badge">Ready to Celebrate</div>
  </main>
</body>
</html>
